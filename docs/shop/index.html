<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NetraaMart – Shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="index.html">Netraa<span>Mart</span></a>
    <div class="search">
      <input type="search" id="q" placeholder="Search NetraaMart..." />
      <button type="button" onclick="filterProducts()">Search</button>
    </div>
    <div class="nav-links">
      <a href="index.html">Products</a>
      <a href="cart.html">Cart <span class="badge" id="cartCount">0</span></a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
      <a href="about.html">About</a>
    </div>
  </header>
  <div class="subnav">
    <a href="#" onclick="filterCat('all');return false;">All</a>
    <a href="#" onclick="filterCat('Electronics');return false;">Electronics</a>
    <a href="#" onclick="filterCat('Clothing');return false;">Clothing</a>
    <a href="#" onclick="filterCat('Books');return false;">Books</a>
    <a href="#" onclick="filterCat('Home');return false;">Home</a>
  </div>
  <div class="banner">
    <h1>Welcome to NetraaMart</h1>
    <p>Browse products · Add to cart · Demo shopping website</p>
  </div>
  <div class="wrap">
    <h2 style="margin-bottom:0.75rem;">Featured products</h2>
    <div class="grid" id="grid"></div>
  </div>
  <footer class="footer">NetraaMart &copy; 2026 · <a href="https://github.com/Netraa-shree/Ecommerce-NetraaMart">GitHub</a></footer>
  <script src="cart.js"></script>
  <script>
    function render(list) {
      document.getElementById("grid").innerHTML = list.map(p => `
        <article class="product-card">
          <div class="img">${p.cat}</div>
          <div class="name">${p.name}</div>
          <div class="stars">${stars(p.stars)}</div>
          <div class="price">₹${p.price.toLocaleString("en-IN")}</div>
          <div style="font-size:0.8rem;color:#565959;">${p.stock} in stock</div>
          <button class="btn" style="margin-top:auto;width:100%;" onclick="addToCart(${p.id})">Add to Cart</button>
        </article>`).join("");
    }
    function filterProducts() {
      const q = document.getElementById("q").value.toLowerCase().trim();
      render(PRODUCTS.filter(p => !q || p.name.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q)));
    }
    function filterCat(cat) {
      render(cat === "all" ? PRODUCTS : PRODUCTS.filter(p => p.cat === cat));
    }
    render(PRODUCTS);
    document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") filterProducts(); });
  </script>
</body>
</html>
