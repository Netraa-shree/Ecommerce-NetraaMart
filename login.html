<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login – NetraaMart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="index.html">Netraa<span>Mart</span></a>
    <div class="nav-links">
      <a href="index.html">Products</a>
      <a href="cart.html">Cart <span class="badge" id="cartCount">0</span></a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </div>
  </header>
  <div class="wrap" style="max-width:420px;">
    <div class="card">
      <h1 style="margin-bottom:0.5rem;">Sign in</h1>
      <p style="color:#565959;margin-bottom:1rem;font-size:0.9rem;">Demo login — saved only in this browser.</p>
      <div id="msg"></div>
      <form onsubmit="return doLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required minlength="4" />
        </div>
        <button class="btn" type="submit" style="width:100%;">Sign in</button>
      </form>
      <p style="margin-top:1rem;font-size:0.9rem;">New here? <a href="register.html">Create an account</a></p>
    </div>
  </div>
  <footer class="footer">NetraaMart &copy; 2026</footer>
  <script src="cart.js"></script>
  <script>
    function doLogin(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      localStorage.setItem("nm_user", email);
      document.getElementById("msg").innerHTML = '<div class="alert">Signed in as <strong>' + email + '</strong> (demo).</div>';
      return false;
    }
  </script>
</body>
</html>
